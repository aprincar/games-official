name: Materialize official games

on:
  push:
    branches:
      - feat/handwriting-painting-age-audit
    paths:
      - .github/workflows/materialize-official-games.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate official game artifacts
        run: npm run build
      - name: Commit generated games
        run: |
          git config user.name "aprincar-ci"
          git config user.email "actions@users.noreply.github.com"
          git add games
          if git diff --cached --quiet; then
            echo "Generated games already materialized."
            exit 0
          fi
          git commit -m "build: materialize 14 official games"
          git push origin HEAD:feat/handwriting-painting-age-audit
