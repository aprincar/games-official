name: Games CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with: {name: aprincar-official-games, path: dist}
